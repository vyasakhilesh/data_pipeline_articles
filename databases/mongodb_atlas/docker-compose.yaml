services:
  mongodb:
    hostname: mongodb
    image: mongodb/mongodb-atlas-local:latest
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=mongoadmin
      - MONGODB_INITDB_ROOT_PASSWORD=password
    ports:
      - 27017:27017
    volumes:
      - ./data:/data/db
      - ./config:/data/configdb
    container_name: mongodb_atlas
    restart: always