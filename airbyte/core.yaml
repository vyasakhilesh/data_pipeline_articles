version: 6.13.0

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - Test

definitions:
  streams:
    Test:
      type: DeclarativeStream
      name: Test
      retriever:
        type: SimpleRetriever
        requester:
          $ref: "#/definitions/base_requester"
          path: works/{{ config['identifier'] }}/outputs
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []
      schema_loader:
        type: InlineSchemaLoader
        schema:
          $ref: "#/schemas/Test"
  base_requester:
    type: HttpRequester
    url_base: https://api.core.ac.uk/v3/
    authenticator:
      type: BearerAuthenticator
      api_token: "{{ config[\"api_key\"] }}"

streams:
  - $ref: "#/definitions/streams/Test"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - identifier
    properties:
      api_key:
        type: string
        title: API Key
        airbyte_secret: true
        order: 0
      identifier:
        type: number
        title: identifier
        order: 1
    additionalProperties: true

metadata:
  autoImportSchema:
    Test: true
  testedStreams:
    Test:
      streamHash: 36dd4969b9ff47b2b64058ce00a8db803634e4d4
      hasResponse: true
      responsesAreSuccessful: true
      hasRecords: true
      primaryKeysArePresent: true
      primaryKeysAreUnique: true
